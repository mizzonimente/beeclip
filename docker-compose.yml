# Ambiente di sviluppo locale: Postgres + Redis + MinIO (storage S3-compatibile).
# Le app (api/worker/web) girano fuori da Docker via `npm run dev:*` per un
# ciclo di sviluppo più rapido (hot reload). In produzione api/worker/web
# vanno containerizzati a loro volta (Dockerfile non incluso in v1, vedi
# docs/05-roadmap.md).
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipmanager
      POSTGRES_PASSWORD: clipmanager
      POSTGRES_DB: clipmanager
    ports:
      - "5432:5432"
    volumes:
      - clipmanager_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipmanager
      MINIO_ROOT_PASSWORD: clipmanager123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clipmanager_minio:/data

volumes:
  clipmanager_pg:
  clipmanager_minio:
